[project]
name = "realtime-trains-py"
version = "2027.2.2b2"
description = "Python API Wrapper for the Realtime Trains API"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"

keywords = [
    "api",
    "api wrapper",
    "realtime trains",
    "train data",
    "train API",
    "UK rail",
    "railway data",
    "train tracking",
    "train schedules",
    "trains",
    "railway",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]

dependencies = [
  "requests>=2.32.3",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
lint = [
  "ruff>=0.5.0",
]
typecheck = [
  "mypy>=1.10.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "build>=1.2.0",
  "pip-audit>=2.7.0",
]

[project.urls]
Repository = "https://github.com/anonymous44401/realtime-trains-py"
Documentation = "https://github.com/anonymous44401/realtime-trains-py/wiki"
Discord = "https://discord.gg/Kv2FAn7SVf"
Issues = "https://github.com/anonymous44401/realtime-trains-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: Unit tests",
  "integration: Integration tests with mocks",
  "regression: Regression tests for past defects",
]

[tool.coverage.run]
source = ["realtime_trains_py"]
branch = true
omit = [
  "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
]
ignore = [
  "E501",   # line length (handled by formatter)
  "B008",   # function call in default argument
  "E712",   # comparison to True (legacy SDK pattern)
  "E721",   # type comparison (legacy SDK pattern)
]

[tool.ruff.lint.per-file-ignores]
"src/realtime_trains_py/__init__.py" = ["F401", "I001"]
"src/realtime_trains_py/async_files/*" = ["I001"]
"src/realtime_trains_py/live/*" = ["I001"]
"src/realtime_trains_py/internal/utilities.py" = ["I001"]
"src/realtime_trains_py/parsing/*" = ["I001", "W291"]
"tests/test_utilities.py" = ["I001"]
"tests/*" = ["F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["realtime_trains_py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["src/realtime_trains_py"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tabulate.*"]
ignore_missing_imports = true
